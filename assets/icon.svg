  <path d="M96 176 L204 116 L300 168 L416 88" fill="none" stroke="url(#line)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="416" cy="88" r="22" fill="#FFB357"/>
