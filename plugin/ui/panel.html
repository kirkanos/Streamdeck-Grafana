<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Panel settings</title>
    <script src="sdpi-components.js"></script>
    <script src="connection.js"></script>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="grafana-connection"></div>

    <div class="requires-connection" hidden>
      <sdpi-item label="Dashboard">
        <sdpi-select setting="dashboardUid" datasource="getDashboards" hot-reload placeholder="Select a dashboard" loading="Loading dashboards…"></sdpi-select>
      </sdpi-item>

      <sdpi-item label="Panel">
        <sdpi-select setting="panelId" datasource="getPanels" hot-reload placeholder="Select a panel" loading="Loading panels…"></sdpi-select>
      </sdpi-item>

      <sdpi-item label="Time range">
        <sdpi-select setting="timeRange" default="1h">
          <option value="1h">Last 1 hour</option>
          <option value="6h">Last 6 hours</option>
          <option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option>
        </sdpi-select>
      </sdpi-item>

      <sdpi-item label="Refresh">
        <sdpi-select setting="refreshSeconds" default="60">
          <option value="10">Every 10 seconds</option>
          <option value="30">Every 30 seconds</option>
          <option value="60">Every minute</option>
          <option value="120">Every 2 minutes</option>
          <option value="300">Every 5 minutes</option>
          <option value="900">Every 15 minutes</option>
          <option value="3600">Every hour</option>
        </sdpi-select>
      </sdpi-item>

      <sdpi-item label="Theme">
        <sdpi-select setting="theme" default="dark">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </sdpi-select>
      </sdpi-item>

      <p class="hint">
        The panel is rendered by Grafana at 144×144 pixels, so stat, gauge and bar gauge panels work best on a key.
        Press the key to open the dashboard in your browser; hold it to refresh the panel right away.
      </p>
    </div>
  </body>
</html>
